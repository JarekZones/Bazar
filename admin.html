<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrace produktů</title>

<style>
  body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f6f8;color:#111}
  .container{max-width:1100px;margin:20px auto;padding:16px;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
  h1{margin:0 0 12px 0;font-size:24px;font-weight:800}
  .adminActions{display:flex;gap:8px;margin-bottom:16px}
  .applyBtn{background:#0b57a4;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
  .clearBtn{background:#fff;color:#444;border:1px solid #ddd;padding:8px 12px;border-radius:8px;cursor:pointer}
  .danger{background:#e02424;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
  .formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  input,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px}
  textarea{resize:vertical}
</style>
</head>

<body>

<div class="container">

  <h1>Administrace produktů</h1>

  <div class="adminActions">
    <button id="addNewBtn" class="applyBtn">Nový produkt</button>
    <button id="exportBtn" class="clearBtn">Export JSON</button>
    <label class="clearBtn" style="cursor:pointer">Import JSON
      <input id="importFile" type="file" accept="application/json" style="display:none">
    </label>
    <button id="resetDefaultsBtn" class="clearBtn">Reset to defaults</button>
    <button id="logoutBtn" class="danger">Odhlásit</button>
  </div>

  <table>
    <thead>
      <tr><th>ID</th><th>Název</th><th>Značka</th><th>Cena</th><th>Akce</th></tr>
    </thead>
    <tbody id="adminTbody"></tbody>
  </table>

  <h2 style="margin-top:20px">Editor produktu</h2>
  <div class="formGrid">
    <input type="hidden" id="editId">

    <div>
      <label>Název</label>
      <input id="editTitle" type="text">
    </div>

    <div>
      <label>Značka</label>
      <input id="editBrand" type="text">
    </div>

    <div>
      <label>Cena (Kč)</label>
      <input id="editPrice" type="number">
    </div>

    <div>
      <label>Barva</label>
      <input id="editColor" type="text">
    </div>

    <div>
      <label>Paměť</label>
      <input id="editMemory" type="text">
    </div>

    <div>
      <label>Demo</label><br>
      <input id="editDemo" type="checkbox">
    </div>

    <div style="grid-column:1/4">
      <label>Popis</label>
      <textarea id="editDescription" rows="5"></textarea>
    </div>

    <div>
      <label>Poznámka</label>
      <input id="editNote" type="text">
    </div>

    <div>
      <label>Obrázek (URL)</label>
      <input id="editImgUrl" type="text">
    </div>

    <div>
      <label>Nahrát obrázek</label><br>
      <input id="editImgFile" type="file" accept="image/*">
    </div>

    <div><label>Nabíječka</label><br><input id="editCharger" type="checkbox"></div>
    <div><label>Datový kabel</label><br><input id="editCable" type="checkbox"></div>
    <div><label>Sluchátka</label><br><input id="editEarphones" type="checkbox"></div>
    <div><label>Pouzdro</label><br><input id="editCase" type="checkbox"></div>
    <div><label>Krabička</label><br><input id="editBox" type="checkbox"></div>
  </div>

  <div style="margin-top:16px;display:flex;gap:8px">
    <button id="saveProductBtn" class="applyBtn">Uložit</button>
    <button id="deleteProductBtn" class="danger" style="display:none">Smazat</button>
    <button id="resetFormBtn" class="clearBtn">Reset</button>
  </div>

</div>

<script>
/* ✔️ LOGIN OCHRANA */
if(localStorage.getItem("adminLogged") !== "true"){
  location.href = "login.html";
}

/* ✔️ LOGOUT */
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("adminLogged");
  location.href = "index.html";
});

/* ✔️ TVŮJ PŮVODNÍ ADMIN KÓD — BEZE ZMĚN */

</script>

</body>
</html>
