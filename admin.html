<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Administrace produktů</title>

<!-- LOGIN OCHRANA -->
<script>
if(localStorage.getItem("adminLogged") !== "true"){
  window.location.href = "login.html";
}
</script>

<style>
  :root{
    --bg:#f5f6f8;
    --card:#fff;
    --muted:#6b7280;
    --accent:#0b57a4;
    --accent-dark:#084a86;
    --badge:#6d28d9;
    --danger:#e02424;
  }
  body{margin:0;font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;background:var(--bg);color:#111}
  .container{max-width:1200px;margin:18px auto;padding:16px}

  .adminPanel{width:100%;background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,0.04)}
  .adminHeader{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .adminActions{margin-left:auto;display:flex;gap:8px}
  .applyBtn{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
  .clearBtn{background:#fff;color:var(--muted);border:1px solid #e2e8f0;padding:8px 12px;border-radius:8px;cursor:pointer}
  .danger{background:var(--danger);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}

  .table{width:100%;border-collapse:collapse;margin-top:12px}
  .table th,.table td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}

  .formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .formGrid input[type="text"],.formGrid input[type="number"],.formGrid textarea{
    width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px
  }
</style>
</head>

<body>
<div class="container">
  <div class="adminPanel">
    <div class="adminHeader">
      <h2 style="margin:0;font-weight:800">Administrace produktů</h2>

      <div class="adminActions">
        <button id="addNewBtn" class="applyBtn">Nový produkt</button>
        <button id="exportBtn" class="clearBtn">Export JSON</button>

        <label class="clearBtn" style="cursor:pointer">Import JSON
          <input id="importFile" type="file" accept="application/json" style="display:none">
        </label>

        <button id="resetDefaultsBtn" class="clearBtn">Reset to defaults</button>

        <button onclick="logout()" class="danger">Odhlásit</button>
      </div>
    </div>

    <table class="table">
      <thead>
        <tr><th>Id</th><th>Název</th><th>Značka</th><th>Cena</th><th>Akce</th></tr>
      </thead>
      <tbody id="adminTbody"></tbody>
    </table>

    <div style="margin-top:20px">
      <h3 style="margin:0;font-weight:700">Editor produktu</h3>

      <div class="formGrid">
        <input type="hidden" id="editId">

        <div>
          <label>Název</label>
          <input id="editTitle" type="text">
        </div>

        <div>
          <label>Značka</label>
          <input id="editBrand" type="text">
        </div>

        <div>
          <label>Cena (Kč)</label>
          <input id="editPrice" type="number">
        </div>

        <div>
          <label>Barva</label>
          <input id="editColor" type="text">
        </div>

        <div>
          <label>Paměť</label>
          <input id="editMemory" type="text">
        </div>

        <div>
          <label>Poznámka</label>
          <textarea id="editNote"></textarea>
        </div>

        <div>
          <label>Obrázek (URL)</label>
          <input id="editImg" type="text">
        </div>
      </div>

      <button id="saveBtn" class="applyBtn" style="margin-top:12px">Uložit</button>
    </div>
  </div>
</div>

<script>
function logout(){
  localStorage.removeItem("adminLogged");
  window.location.href = "login.html";
}
</script>

<!-- TVŮJ ADMIN SCRIPT -->
<script src="../js/admin.js"></script>

</body>
</html>
