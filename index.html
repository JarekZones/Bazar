<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soukromý bazárek</title><style>
:root{--bg:#f5f6f8;--card:#fff;--muted:#6b7280;--accent:#0b57a4;--accent-dark:#084a86;--badge:#6d28d9}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#111}.container{max-width:1200px;margin:18px auto;padding:16px}.hero{position:relative;margin-bottom:22px;border-radius:18px;overflow:hidden;background:#eadfce;box-shadow:0 5px 20px rgba(0,0,0,.09)}.hero img{width:100%;height:auto;display:block}.categoryHero{margin:0 0 18px;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer}.categoryHero img{width:100%;height:auto;display:block}.adminBtn{position:absolute;right:14px;top:14px;background:rgba(17,17,17,.88);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer;z-index:2}.small,.mutedSmall{font-size:13px;color:var(--muted)}.categoryIntro{margin:8px 0 16px}.categoryIntro h2{margin:0 0 5px;font-size:24px}.categoryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.categoryTile{position:relative;height:240px;border:0;border-radius:16px;overflow:hidden;cursor:pointer;background:#dfe5ec;text-align:left;padding:0;box-shadow:0 4px 16px rgba(0,0,0,.08)}.categoryTile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.categoryTile:hover img{transform:scale(1.025)}.categoryFallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:15px}.categoryOverlay{position:absolute;inset:auto 0 0;padding:45px 18px 17px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}.categoryName{font-size:22px;font-weight:800}.categoryCount{font-size:13px;margin-top:4px;opacity:.9}.emptyCategories{grid-column:1/-1;background:#fff;border-radius:12px;padding:35px;text-align:center;color:var(--muted)}.productsView{display:none}.productsTop{display:flex;align-items:center;gap:12px;margin-bottom:14px}.backBtn{background:#fff;border:1px solid #d9dee7;border-radius:8px;padding:9px 12px;cursor:pointer}.productsTitle{font-size:22px;font-weight:800}.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.filters{background:#fff;padding:16px;border-radius:10px}.filterTitle{font-weight:700;margin-bottom:8px}.checkboxRow{display:flex;gap:8px;margin:8px 0}.rangeRow input{width:48%;padding:6px;border:1px solid #ddd;border-radius:6px}.applyBtn,.cta{background:var(--accent);color:#fff;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}.applyBtn:disabled{opacity:.65;cursor:wait}.clearBtn{background:#fff;border:1px solid #dfe5ec;padding:8px 12px;border-radius:8px;cursor:pointer;margin-left:6px}.infoBar{display:flex;justify-content:space-between;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:320px;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1)}.thumb{height:140px;background:#e9eef3;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.cardBody{flex:1}.title{font-weight:700}.meta{font-size:13px;color:var(--muted)}.price{font-size:20px;font-weight:800;margin:10px 0}.cta{width:100%}.modalBack,.emailModalBack,.contactModalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}.modal{width:100%;max-width:1040px;min-width:0;background:#fff;border-radius:14px;padding:20px;max-height:92vh;overflow:auto}.modalTop{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.9fr);gap:24px;min-width:0}.galleryWrap,.infoBox{min-width:0}.galleryWrap{position:relative}.galleryMain{width:100%;max-width:100%;height:430px;background:#f0f3f6;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.galleryMain img{display:block;width:100%;max-width:100%;height:100%;object-fit:contain;cursor:zoom-in}.thumbRow{display:flex;max-width:100%;gap:10px;margin-top:10px;overflow-x:auto}.thumbSmall{width:68px;height:56px;flex:0 0 68px;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer}.thumbSmall.active{border-color:var(--accent)}.thumbSmall img{width:100%;height:100%;object-fit:contain}.galleryCount{font-size:13px;color:var(--muted);margin-top:7px}.infoBox{display:flex;flex-direction:column;min-height:430px}.infoTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0}.infoTop>div:first-child{min-width:0}.modalTitle,.modalMeta,.descriptionText,.modalNote{overflow-wrap:anywhere;word-break:break-word}.modalTitle{font-size:28px;font-weight:800}.modalMeta{font-size:18px;color:var(--muted);margin-top:6px}.badge{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;flex:0 0 auto;background:var(--badge);color:#fff;padding:6px 10px;border-radius:999px;font-weight:700;line-height:1.2;white-space:nowrap}.newBadge{background:#15803d}.modalPrice{font-size:32px;font-weight:800;margin-top:20px}.sectionTitle{font-size:20px;font-weight:700}.modalNoteBox,.featureBox{margin-top:20px;padding-top:16px;border-top:1px solid #edf0f3}.modalNote{font-size:18px;color:var(--muted);margin-top:8px}.featureList{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.featureItem{font-size:18px}.buyArea{margin-top:auto;padding-top:22px}.buyButton{width:100%;background:#1769d2;color:#fff;border:0;padding:15px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer}.descriptionBox{margin-top:20px;padding-top:20px;border-top:1px solid #e5e7eb}.descriptionText{font-size:18px;color:#4b5563;line-height:1.65;white-space:pre-line}.modalClose{position:absolute;right:12px;top:12px;width:36px;height:36px;background:var(--accent-dark);color:#fff;border:0;border-radius:8px;cursor:pointer;z-index:2}.contactModal,.emailPanel{width:100%;max-width:430px;background:#fff;border-radius:14px;padding:22px;position:relative}.contactButtons{display:grid;gap:10px}.contactBtn{padding:12px;border:0;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}.contactMessenger{background:#0084ff}.contactEmail{background:var(--accent)}.formRow{margin-top:10px}.formRow input,.formRow textarea{width:100%;padding:9px;border:1px solid #dfe5ec;border-radius:7px}.emailStatus{min-height:20px;margin-top:10px;font-size:14px}.emailStatus.ok{color:#15803d}.emailStatus.error{color:#b91c1c}.hpField{position:absolute!important;left:-10000px!important;top:auto!important;width:1px!important;height:1px!important;overflow:hidden!important}.imageFallback{width:100%;height:100%;min-height:90px;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;color:#64748b;background:#e9eef3;font-size:14px}.imageLightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:20px;z-index:120}.imageLightbox.open{display:flex}.imageLightbox img{display:block;max-width:96vw;max-height:92vh;width:auto;height:auto;object-fit:contain}.imageLightboxClose{position:fixed;right:18px;top:18px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:25px;line-height:1;cursor:pointer;z-index:121}.imageLightboxNav{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:64px;border:0;border-radius:12px;background:rgba(255,255,255,.88);color:#111;font-size:40px;line-height:1;cursor:pointer;z-index:121}.imageLightboxPrev{left:18px}.imageLightboxNext{right:18px}.imageLightboxNav:disabled{display:none}.imageLightboxCounter{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;z-index:121}.categoryTile:focus-visible,.categoryHero:focus-visible,.card:focus-visible,.adminBtn:focus-visible,.backBtn:focus-visible,.applyBtn:focus-visible,.clearBtn:focus-visible,.cta:focus-visible,.buyButton:focus-visible,.modalClose:focus-visible,.contactBtn:focus-visible,.formRow input:focus-visible,.formRow textarea:focus-visible,.galleryMain img:focus-visible,.imageLightboxClose:focus-visible,.imageLightboxNav:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.categoryTile:focus-visible,.card:focus-visible,.categoryHero:focus-visible{box-shadow:0 0 0 4px rgba(11,87,164,.18),0 6px 18px rgba(0,0,0,.1)}@media(max-width:900px){.categoryGrid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.modalTop{grid-template-columns:minmax(0,1fr)}.galleryMain{height:320px}.infoBox{min-height:auto}}@media(max-width:520px){.container{padding:10px;margin-top:6px}.hero,.categoryHero{border-radius:12px}.adminBtn{right:8px;top:8px;padding:6px 9px;font-size:12px}.categoryGrid,.grid{grid-template-columns:1fr}.categoryTile{height:210px}.featureList{grid-template-columns:1fr}.productsTop{align-items:flex-start}.categoryIntro h2,.productsTitle{font-size:20px}.modalBack{padding:8px;align-items:flex-start}.modal{width:100%;max-width:100%;padding:12px;border-radius:10px;max-height:calc(100vh - 16px);overflow-x:hidden}.modalTop{width:100%;max-width:100%;gap:16px}.galleryWrap,.galleryMain,.infoBox,.descriptionBox{width:100%;max-width:100%}.galleryMain{height:min(78vw,320px)}.thumbRow{width:100%}.modalTitle{font-size:23px}.modalMeta{font-size:16px}.modalPrice{font-size:28px}.sectionTitle{font-size:18px}.modalNote,.descriptionText,.featureItem{font-size:16px}.infoTop{padding-right:0}.badge{font-size:13px}.imageLightbox{padding:8px}.imageLightbox img{max-width:100%;max-height:94vh}.imageLightboxClose{right:10px;top:10px}.imageLightboxNav{width:44px;height:56px;font-size:34px;background:rgba(255,255,255,.8)}.imageLightboxPrev{left:8px}.imageLightboxNext{right:8px}.imageLightboxCounter{bottom:10px}}
</style></head><body><div class="container"><div class="hero" id="homeHero"><img src="images/bazarek-hero.png" alt="Soukromý bazárek – Dejte věcem druhou šanci"><button class="adminBtn" id="openAdminBtn">Admin</button></div>
<section id="categoriesView"><div class="categoryIntro"><h2>Kategorie</h2><div class="small">Co právě hledáte?</div></div><div id="categoryGrid" class="categoryGrid"></div></section>
<section id="productsView" class="productsView"><div class="categoryHero" id="categoryHero" role="button" tabindex="0" aria-label="Zpět na hlavní stránku"><img src="images/bazarek2-hero.jpg" alt="Dejte věcem druhou šanci"></div><div class="productsTop"><button id="backToCategories" class="backBtn">← Všechny kategorie</button><div><div id="productsTitle" class="productsTitle">Produkty</div><div id="productsSubtitle" class="small"></div></div></div><div class="layout"><aside class="filters"><div class="filterTitle">Filtr</div><div id="brandFilterWrap"><div class="small">Výrobce / značka</div><div id="makerList"></div></div><div class="rangeRow"><div class="small" style="margin-top:12px">Cena (Kč)</div><div style="display:flex;gap:6px;margin-top:7px"><input id="minPrice" type="number" placeholder="min"><input id="maxPrice" type="number" placeholder="max"></div></div><div style="margin-top:10px"><button class="applyBtn" id="applyFilter">Použít</button><button class="clearBtn" id="clearFilter">Vymazat</button></div></aside><main><div class="infoBar"><div id="resultCount"></div><div class="mutedSmall">Aktuální nabídka</div></div><div class="grid" id="grid"></div></main></div></section></div>
<div class="modalBack" id="modalBack"><div class="modal"><div class="modalTop"><div class="galleryWrap" id="modalGalleryWrapper"><button class="modalClose" id="closeModal">✕</button><div class="galleryMain" id="modalMain"></div><div class="thumbRow" id="modalThumbs"></div></div><aside class="infoBox"><div class="infoTop"><div><div id="modalTitle" class="modalTitle"></div><div id="modalMeta" class="modalMeta"></div></div><div id="modalBadge" class="badge" style="display:none"></div></div><div id="modalPrice" class="modalPrice"></div><div class="modalNoteBox" id="modalNoteBox"><div class="sectionTitle">Doplňující informace</div><div id="modalDesc" class="modalNote"></div></div><div class="featureBox" id="featureBox"><div class="sectionTitle">Vlastnosti</div><div class="featureList" id="modalFeatures"></div></div><div class="buyArea"><button class="buyButton" id="buyButton">Koupit</button></div></aside></div><div class="descriptionBox" id="descriptionBox"><div class="sectionTitle">Popis produktu</div><div id="modalDescription" class="descriptionText"></div></div></div></div>
<div class="imageLightbox" id="imageLightbox" aria-hidden="true"><button class="imageLightboxClose" id="imageLightboxClose" aria-label="Zavřít zvětšený obrázek">✕</button><button class="imageLightboxNav imageLightboxPrev" id="imageLightboxPrev" aria-label="Předchozí obrázek">‹</button><img id="imageLightboxImg" alt="Zvětšená fotografie produktu"><button class="imageLightboxNav imageLightboxNext" id="imageLightboxNext" aria-label="Další obrázek">›</button><div class="imageLightboxCounter" id="imageLightboxCounter"></div></div>
<div class="contactModalBack" id="contactModalBack"><div class="contactModal"><button class="modalClose" id="closeContactModal">✕</button><h3>Jak chcete kontaktovat prodejce?</h3><div id="contactProductText" class="small" style="margin-bottom:16px"></div><div class="contactButtons"><button class="contactBtn contactMessenger" id="contactMessengerBtn">Kontakt přes Messenger</button><button class="contactBtn contactEmail" id="contactEmailBtn">Kontakt přes e-mail</button></div></div></div>
<div class="emailModalBack" id="emailModalBack"><div class="emailPanel"><h3>Poslat e-mail</h3><form id="emailForm"><div class="hpField" aria-hidden="true"><label>Web<input id="contactWebsite" name="website" type="text" tabindex="-1" autocomplete="off"></label></div><div class="formRow"><input id="senderName" placeholder="Jméno" maxlength="100" required></div><div class="formRow"><input id="senderEmail" type="email" placeholder="E-mail" maxlength="254" required></div><div class="formRow"><textarea id="senderMessage" rows="5" maxlength="4000" required></textarea></div><div id="emailStatus" class="emailStatus" aria-live="polite"></div><div style="margin-top:4px"><button class="applyBtn" id="sendEmailBtn" type="submit">Odeslat e-mail</button><button class="clearBtn" type="button" id="cancelEmail">Zrušit</button></div></form></div></div>
<script>
const API_URL="https://mobilmax-bazar-api.j-preclik.workers.dev",sellerMessenger="https://m.me/jaroslav.preclik";let products=[],categories=[],currentCategoryId=null,currentProductForContact=null,currentProductForEmail=null,emailFormStartedAt=0,lightboxImages=[],lightboxIndex=0;
async function loadData(){const r=await fetch(API_URL+"/api/products",{cache:"no-store"});if(!r.ok)throw new Error("Načtení se nepodařilo");const d=await r.json();return{products:Array.isArray(d.products)?d.products:[],categories:Array.isArray(d.categories)?d.categories:[]}}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function formatPrice(n){return Number(n)?Number(n).toLocaleString("cs-CZ")+" Kč":"Na dotaz"}function getProductImages(p){return Array.isArray(p?.images)&&p.images.length?p.images.filter(Boolean):(p?.img?[p.img]:[])}
function categoryFor(p){return categories.find(c=>c.id===p.category)}function categoryFields(cat){return cat?.fields||{brand:true,color:true,memory:true,note:true}}function publicMeta(p,cat){const f=categoryFields(cat),vals=[];if(f.brand&&p.brand)vals.push(p.brand);if(f.color&&p.color)vals.push(p.color);if(f.memory&&p.memory)vals.push(p.memory);return vals}
function renderCategories(){categoryGrid.innerHTML="";const visible=categories.filter(c=>c.visible!==false&&products.some(p=>p.category===c.id));if(!visible.length){categoryGrid.innerHTML='<div class="emptyCategories">Momentálně nejsou k dispozici žádné kategorie s aktivními produkty.</div>';return}visible.forEach(c=>{const count=products.filter(p=>p.category===c.id).length,t=document.createElement("button");t.className="categoryTile";t.dataset.id=c.id;t.innerHTML=`${c.image?`<img src="${escapeHtml(c.image)}" alt="${escapeHtml(c.name)}">`:'<div class="categoryFallback">Bez obrázku kategorie</div>'}<div class="categoryOverlay"><div class="categoryName">${escapeHtml(c.name)}</div><div class="categoryCount">${count} ${count===1?'položka':'položek'}</div></div>`;t.onclick=()=>openCategory(c.id);categoryGrid.appendChild(t)})}
function openCategory(id){currentCategoryId=id;const c=categories.find(x=>x.id===id);homeHero.style.display="none";categoriesView.style.display="none";productsView.style.display="block";productsTitle.textContent=c?.name||"Produkty";productsSubtitle.textContent="Nabídka v této kategorii";renderMakers();clearProductFilters();window.scrollTo({top:0,behavior:"smooth"})}
function showCategories(){currentCategoryId=null;productsView.style.display="none";categoriesView.style.display="block";homeHero.style.display="block";window.scrollTo({top:0,behavior:"smooth"})}
function categoryProducts(){return products.filter(p=>p.category===currentCategoryId)}
function renderMakers(){const cat=categories.find(c=>c.id===currentCategoryId),showBrand=categoryFields(cat).brand!==false;brandFilterWrap.style.display=showBrand?"block":"none";makerList.innerHTML="";if(!showBrand)return;const makers=[...new Set(categoryProducts().map(p=>p.brand).filter(Boolean))].sort();makers.forEach(m=>{const l=document.createElement("label");l.className="checkboxRow";l.innerHTML=`<input type="checkbox" value="${escapeHtml(m)}"> ${escapeHtml(m)}`;l.querySelector("input").onchange=applyProductFilter;makerList.appendChild(l)})}
function renderGrid(list){grid.innerHTML="";if(!list.length)grid.innerHTML='<div class="small" style="grid-column:1/-1;padding:30px">Momentálně nejsou k dispozici žádné odpovídající produkty.</div>';list.forEach(p=>{const card=document.createElement("div");card.className="card";card.tabIndex=0;card.setAttribute("role","button");card.setAttribute("aria-label",`Zobrazit detail ${p.title||"produktu"}`);const cover=getProductImages(p)[0]||"",meta=publicMeta(p,categoryFor(p));card.innerHTML=`<div class="thumb">${cover?`<img src="${escapeHtml(cover)}">`:"Bez fotografie"}</div><div class="cardBody"><div class="title">${escapeHtml(p.title)}</div><div class="meta">${meta.map(escapeHtml).join(" · ")}</div><div class="price">${formatPrice(p.price)}</div></div><button class="cta" data-id="${p.id}">Zobrazit detail</button>`;card.onclick=()=>openModal(Number(p.id));card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openModal(Number(p.id))}};grid.appendChild(card)});grid.querySelectorAll(".cta").forEach(b=>b.onclick=e=>{e.stopPropagation();openModal(Number(b.dataset.id))});resultCount.textContent=`Zobrazeno ${list.length} položek`}
function applyProductFilter(){const checked=[...makerList.querySelectorAll("input:checked")].map(i=>i.value),min=minPrice.value===""?null:Number(minPrice.value),max=maxPrice.value===""?null:Number(maxPrice.value);renderGrid(categoryProducts().filter(p=>(!checked.length||checked.includes(p.brand))&&(min===null||Number(p.price)>=min)&&(max===null||Number(p.price)<=max)))}
function clearProductFilters(){makerList.querySelectorAll("input").forEach(i=>i.checked=false);minPrice.value="";maxPrice.value="";applyProductFilter()}
function updateLightbox(){if(!lightboxImages.length)return;imageLightboxImg.src=lightboxImages[lightboxIndex];const multiple=lightboxImages.length>1;imageLightboxPrev.disabled=!multiple;imageLightboxNext.disabled=!multiple;imageLightboxCounter.style.display=multiple?"block":"none";imageLightboxCounter.textContent=`${lightboxIndex+1} / ${lightboxImages.length}`}
function openImageLightbox(src,images=[]){if(!src)return;lightboxImages=Array.isArray(images)&&images.length?images:[src];lightboxIndex=Math.max(0,lightboxImages.indexOf(src));updateLightbox();imageLightbox.classList.add("open");imageLightbox.setAttribute("aria-hidden","false");imageLightboxClose.focus()}function moveLightbox(step){if(lightboxImages.length<2)return;lightboxIndex=(lightboxIndex+step+lightboxImages.length)%lightboxImages.length;updateLightbox()}function closeImageLightbox(){imageLightbox.classList.remove("open");imageLightbox.setAttribute("aria-hidden","true");imageLightboxImg.removeAttribute("src");lightboxImages=[];lightboxIndex=0}
function showMainImage(src,images=[]){modalMain.innerHTML="";const im=document.createElement("img");im.src=src;im.alt="Fotografie produktu – kliknutím zvětšit";im.tabIndex=0;im.setAttribute("role","button");im.setAttribute("aria-label","Zvětšit fotografii produktu");im.onclick=()=>openImageLightbox(src,images);im.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openImageLightbox(src,images)}};modalMain.appendChild(im)}
function openModal(id){const p=products.find(x=>Number(x.id)===id);if(!p)return;const images=getProductImages(p),cat=categoryFor(p),fields=categoryFields(cat);modalMain.innerHTML="";modalThumbs.innerHTML="";document.querySelectorAll("#modalGalleryWrapper .galleryCount").forEach(x=>x.remove());if(images.length){showMainImage(images[0],images);images.forEach((src,i)=>{const t=document.createElement("div");t.className="thumbSmall"+(i===0?" active":"");t.innerHTML=`<img src="${escapeHtml(src)}">`;t.onclick=()=>{showMainImage(src,images);modalThumbs.querySelectorAll(".thumbSmall").forEach(x=>x.classList.remove("active"));t.classList.add("active")};modalThumbs.appendChild(t)});const cnt=document.createElement("div");cnt.className="galleryCount";cnt.textContent=`${images.length} obrázků`;modalGalleryWrapper.appendChild(cnt)}else modalMain.textContent="Bez fotografie";modalTitle.textContent=p.title||"";modalMeta.textContent=publicMeta(p,cat).join(" · ");modalMeta.style.display=modalMeta.textContent?"block":"none";modalPrice.textContent=formatPrice(p.price);if(p.condition==="new"){modalBadge.style.display="inline-flex";modalBadge.className="badge newBadge";modalBadge.textContent="Nové"}else if(p.condition==="demo"||p.demo){modalBadge.style.display="inline-flex";modalBadge.className="badge";modalBadge.textContent="Předváděcí"}else modalBadge.style.display="none";const showNote=fields.note!==false&&String(p.note||"").trim();modalNoteBox.style.display=showNote?"block":"none";modalDesc.textContent=showNote?p.note:"";const showDescription=!!String(p.description||"").trim();descriptionBox.style.display=showDescription?"block":"none";modalDescription.textContent=showDescription?p.description:"";modalFeatures.innerHTML="";const selected=new Set(Array.isArray(p.features)?p.features:[]),defs=Array.isArray(cat?.features)?cat.features:[];defs.filter(f=>selected.has(f.id)).forEach(f=>{const n=document.createElement("div");n.className="featureItem";n.innerHTML=`<span style="color:var(--accent)">✓</span> ${escapeHtml(f.name)}`;modalFeatures.appendChild(n)});featureBox.style.display=modalFeatures.children.length?"block":"none";buyButton.onclick=()=>openContactModal(p);modalBack.style.display="flex"}
function closeProductModal(){closeImageLightbox();modalBack.style.display="none"}function openContactModal(p){currentProductForContact=p;contactProductText.textContent=`Máte zájem o produkt ${p.title}.`;contactModalBack.style.display="flex"}function closeContact(){contactModalBack.style.display="none"}function openEmail(p){currentProductForEmail=p;emailFormStartedAt=Date.now();contactWebsite.value="";senderMessage.value=`Dobrý den, mám zájem o ${p.title}.\n\nProsím o informaci, zda je produkt stále k dispozici.`;emailStatus.textContent="";emailStatus.className="emailStatus";emailModalBack.style.display="flex"}

emailForm.onsubmit=async e=>{e.preventDefault();if(!currentProductForEmail)return;emailStatus.textContent="Odesílám zprávu…";emailStatus.className="emailStatus";sendEmailBtn.disabled=true;try{const r=await fetch(API_URL+"/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productId:currentProductForEmail.id,name:senderName.value,email:senderEmail.value,message:senderMessage.value,website:contactWebsite.value,startedAt:emailFormStartedAt})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"E-mail se nepodařilo odeslat.");emailStatus.textContent=d.message||"Zpráva byla úspěšně odeslána.";emailStatus.className="emailStatus ok";emailForm.reset();currentProductForEmail=null;setTimeout(()=>{emailModalBack.style.display="none";emailStatus.textContent="";emailStatus.className="emailStatus"},1400)}catch(err){emailStatus.textContent=err.message||"E-mail se nepodařilo odeslat.";emailStatus.className="emailStatus error"}finally{sendEmailBtn.disabled=false}};
openAdminBtn.onclick=()=>location.href="./login.html";backToCategories.onclick=showCategories;categoryHero.onclick=showCategories;categoryHero.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showCategories()}};document.getElementById("applyFilter").onclick=applyProductFilter;clearFilter.onclick=clearProductFilters;document.addEventListener("keydown",e=>{if(imageLightbox.classList.contains("open")){if(e.key==="Escape")closeImageLightbox();else if(e.key==="ArrowLeft")moveLightbox(-1);else if(e.key==="ArrowRight")moveLightbox(1);return}if(e.key==="Escape"){closeProductModal();closeContact();emailModalBack.style.display="none"}});
