<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nabídka bazaru</title><style>
:root{--bg:#f5f6f8;--card:#fff;--muted:#6b7280;--accent:#0b57a4;--accent-dark:#084a86;--badge:#6d28d9}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#111}.container{max-width:1200px;margin:18px auto;padding:16px}header{display:flex;align-items:center;gap:16px;margin-bottom:16px}.brandImg{width:72px;height:56px;background:#e9eef3;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}h1{font-size:20px;margin:0}.adminBtn{margin-left:auto;background:#111;color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer}.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.filters{background:#fff;padding:16px;border-radius:10px}.filterTitle{font-weight:700;margin-bottom:8px}.checkboxRow{display:flex;gap:8px;margin:8px 0}.rangeRow input{width:48%;padding:6px;border:1px solid #ddd;border-radius:6px}.applyBtn,.cta{background:var(--accent);color:#fff;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}.clearBtn{background:#fff;border:1px solid #dfe5ec;padding:8px 12px;border-radius:8px;cursor:pointer;margin-left:6px}.infoBar{display:flex;justify-content:space-between;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:320px}.thumb{height:140px;background:#e9eef3;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.cardBody{flex:1}.title{font-weight:700}.meta,.small,.mutedSmall{font-size:13px;color:var(--muted)}.price{font-size:20px;font-weight:800;margin:10px 0}.cta{width:100%}.modalBack,.emailModalBack,.contactModalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}.modal{width:100%;max-width:1040px;background:#fff;border-radius:14px;padding:20px;max-height:92vh;overflow:auto}.modalTop{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.9fr);gap:24px}.galleryWrap{position:relative}.galleryMain{height:430px;background:#f0f3f6;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.galleryMain img{width:100%;height:100%;object-fit:contain}.thumbRow{display:flex;gap:10px;margin-top:10px;overflow-x:auto}.thumbSmall{width:68px;height:56px;flex:0 0 68px;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer}.thumbSmall.active{border-color:var(--accent)}.thumbSmall img{width:100%;height:100%;object-fit:contain}.galleryCount{font-size:13px;color:var(--muted);margin-top:7px}.infoBox{display:flex;flex-direction:column;min-height:430px}.infoTop{display:flex;justify-content:space-between;gap:10px}.modalTitle{font-size:28px;font-weight:800}.modalMeta{font-size:18px;color:var(--muted);margin-top:6px}.badge{display:inline-block;background:var(--badge);color:#fff;padding:6px 10px;border-radius:999px;font-weight:700}.newBadge{background:#15803d}.modalPrice{font-size:32px;font-weight:800;margin-top:20px}.sectionTitle{font-size:20px;font-weight:700}.modalNoteBox,.featureBox{margin-top:20px;padding-top:16px;border-top:1px solid #edf0f3}.modalNote{font-size:18px;color:var(--muted);margin-top:8px}.featureList{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.featureItem{font-size:18px}.buyArea{margin-top:auto;padding-top:22px}.buyButton{width:100%;background:#1769d2;color:#fff;border:0;padding:15px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer}.descriptionBox{margin-top:20px;padding-top:20px;border-top:1px solid #e5e7eb}.descriptionText{font-size:18px;color:#4b5563;line-height:1.65}.modalClose{position:absolute;right:12px;top:12px;width:36px;height:36px;background:var(--accent-dark);color:#fff;border:0;border-radius:8px;cursor:pointer;z-index:2}.contactModal,.emailPanel{width:100%;max-width:430px;background:#fff;border-radius:14px;padding:22px;position:relative}.contactButtons{display:grid;gap:10px}.contactBtn{padding:12px;border:0;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}.contactMessenger{background:#0084ff}.contactEmail{background:var(--accent)}.formRow{margin-top:10px}.formRow input,.formRow textarea{width:100%;padding:9px;border:1px solid #dfe5ec;border-radius:7px}@media(max-width:900px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.modalTop{grid-template-columns:1fr}.galleryMain{height:320px}.infoBox{min-height:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}.featureList{grid-template-columns:1fr}.container{padding:10px}}
</style></head><body><div class="container"><header><div class="brandImg">IMG</div><div><h1>Nabídka bazaru</h1><div class="small">Aktuální nabídka zboží</div></div><button class="adminBtn" id="openAdminBtn">Admin</button></header><div class="layout"><aside class="filters"><div class="filterTitle">Filtr</div><div class="small">Výrobce / značka</div><div id="makerList"></div><div class="rangeRow"><div class="small" style="margin-top:12px">Cena (Kč)</div><div style="display:flex;gap:6px;margin-top:7px"><input id="minPrice" type="number" placeholder="min"><input id="maxPrice" type="number" placeholder="max"></div></div><div style="margin-top:10px"><button class="applyBtn" id="applyFilter">Použít</button><button class="clearBtn" id="clearFilter">Vymazat</button></div></aside><main><div class="infoBar"><div id="resultCount">Načítám…</div><div class="mutedSmall">Aktuální nabídka</div></div><div class="grid" id="grid"></div></main></div></div>
<div class="modalBack" id="modalBack"><div class="modal"><div class="modalTop"><div class="galleryWrap" id="modalGalleryWrapper"><button class="modalClose" id="closeModal">✕</button><div class="galleryMain" id="modalMain"></div><div class="thumbRow" id="modalThumbs"></div></div><aside class="infoBox"><div class="infoTop"><div><div id="modalTitle" class="modalTitle"></div><div id="modalMeta" class="modalMeta"></div></div><div id="modalBadge" class="badge" style="display:none"></div></div><div id="modalPrice" class="modalPrice"></div><div class="modalNoteBox"><div class="sectionTitle">Doplňující informace</div><div id="modalDesc" class="modalNote"></div></div><div class="featureBox"><div class="sectionTitle">Vlastnosti</div><div class="featureList" id="modalFeatures"></div></div><div class="buyArea"><button class="buyButton" id="buyButton">Koupit</button></div></aside></div><div class="descriptionBox"><div class="sectionTitle">Popis produktu</div><div id="modalDescription" class="descriptionText"></div></div></div></div>
<div class="contactModalBack" id="contactModalBack"><div class="contactModal"><button class="modalClose" id="closeContactModal">✕</button><h3>Jak chcete kontaktovat prodejce?</h3><div id="contactProductText" class="small" style="margin-bottom:16px"></div><div class="contactButtons"><button class="contactBtn contactMessenger" id="contactMessengerBtn">Kontakt přes Messenger</button><button class="contactBtn contactEmail" id="contactEmailBtn">Kontakt přes e-mail</button></div></div></div>
<div class="emailModalBack" id="emailModalBack"><div class="emailPanel"><h3>Poslat e-mail</h3><form id="emailForm"><div class="formRow"><input id="senderName" placeholder="Jméno" required></div><div class="formRow"><input id="senderEmail" type="email" placeholder="E-mail" required></div><div class="formRow"><textarea id="senderMessage" rows="5" required></textarea></div><div style="margin-top:10px"><button class="applyBtn" type="submit">Odeslat e-mail</button><button class="clearBtn" type="button" id="cancelEmail">Zrušit</button></div></form></div></div>
<script>
const API_URL="https://mobilmax-bazar-api.j-preclik.workers.dev",sellerMessenger="https://m.me/jaroslav.preclik",sellerEmail="j.preclik@mobilmax.cz";let products=[],categories=[],currentProductForContact=null,currentProductForEmail=null;
async function loadData(){const r=await fetch(API_URL+"/api/products",{cache:"no-store"});if(!r.ok)throw new Error("Načtení se nepodařilo");const d=await r.json();return{products:Array.isArray(d.products)?d.products:[],categories:Array.isArray(d.categories)?d.categories:[]}}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function formatPrice(n){return Number(n)?Number(n).toLocaleString("cs-CZ")+" Kč":"Na dotaz"}function getProductImages(p){return Array.isArray(p?.images)&&p.images.length?p.images.filter(Boolean):(p?.img?[p.img]:[])}
function renderMakers(){const makers=[...new Set(products.map(p=>p.brand).filter(Boolean))].sort();makerList.innerHTML="";makers.forEach(m=>{const l=document.createElement("label");l.className="checkboxRow";l.innerHTML=`<input type="checkbox" value="${escapeHtml(m)}"> ${escapeHtml(m)}`;l.querySelector("input").onchange=applyFilter;makerList.appendChild(l)})}
function renderGrid(list){grid.innerHTML="";if(!list.length)grid.innerHTML='<div class="small" style="grid-column:1/-1;padding:30px">Momentálně nejsou k dispozici žádné odpovídající produkty.</div>';list.forEach(p=>{const card=document.createElement("div");card.className="card";const cover=getProductImages(p)[0]||"";card.innerHTML=`<div class="thumb">${cover?`<img src="${escapeHtml(cover)}">`:"Bez fotografie"}</div><div class="cardBody"><div class="title">${escapeHtml(p.title)}</div><div class="meta">${escapeHtml(p.brand)} · ${escapeHtml(p.color||"")} · ${escapeHtml(p.memory||"")}</div><div class="price">${formatPrice(p.price)}</div></div><button class="cta" data-id="${p.id}">Zobrazit detail</button>`;grid.appendChild(card)});grid.querySelectorAll(".cta").forEach(b=>b.onclick=()=>openModal(Number(b.dataset.id)));resultCount.textContent=`Zobrazeno ${list.length} položek`}
function applyFilter(){const checked=[...makerList.querySelectorAll("input:checked")].map(i=>i.value),min=minPrice.value===""?null:Number(minPrice.value),max=maxPrice.value===""?null:Number(maxPrice.value);renderGrid(products.filter(p=>(!checked.length||checked.includes(p.brand))&&(min===null||Number(p.price)>=min)&&(max===null||Number(p.price)<=max)))}
function categoryFor(p){return categories.find(c=>c.id===p.category)}
function openModal(id){const p=products.find(x=>Number(x.id)===id);if(!p)return;const images=getProductImages(p),cat=categoryFor(p);modalMain.innerHTML="";modalThumbs.innerHTML="";document.querySelectorAll("#modalGalleryWrapper .galleryCount").forEach(x=>x.remove());if(images.length){const im=document.createElement("img");im.src=images[0];modalMain.appendChild(im);images.forEach((src,i)=>{const t=document.createElement("div");t.className="thumbSmall"+(i===0?" active":"");t.innerHTML=`<img src="${escapeHtml(src)}">`;t.onclick=()=>{im.src=src;modalThumbs.querySelectorAll(".thumbSmall").forEach(x=>x.classList.remove("active"));t.classList.add("active")};modalThumbs.appendChild(t)});const cnt=document.createElement("div");cnt.className="galleryCount";cnt.textContent=`${images.length} obrázků`;modalGalleryWrapper.appendChild(cnt)}else modalMain.textContent="Bez fotografie";modalTitle.textContent=p.title||"";modalMeta.textContent=[p.color,p.memory].filter(Boolean).join(" · ");modalPrice.textContent=formatPrice(p.price);if(p.condition==="new"){modalBadge.style.display="inline-block";modalBadge.className="badge newBadge";modalBadge.textContent="Nové"}else if(p.condition==="demo"||p.demo){modalBadge.style.display="inline-block";modalBadge.className="badge";modalBadge.textContent="Předváděcí"}else modalBadge.style.display="none";modalDesc.textContent=p.note||"Bez doplňujících informací.";modalDescription.innerHTML="";(p.description||"").split(/\n\s*\n/).filter(Boolean).forEach(txt=>{const par=document.createElement("p");par.textContent=txt;modalDescription.appendChild(par)});modalFeatures.innerHTML="";const selected=new Set(Array.isArray(p.features)?p.features:[]),defs=Array.isArray(cat?.features)?cat.features:[];defs.filter(f=>selected.has(f.id)).forEach(f=>{const n=document.createElement("div");n.className="featureItem";n.innerHTML=`<span style="color:var(--accent)">✓</span> ${escapeHtml(f.name)}`;modalFeatures.appendChild(n)});if(!modalFeatures.children.length)modalFeatures.innerHTML='<div class="mutedSmall">Bez uvedených vlastností.</div>';buyButton.onclick=()=>openContactModal(p);modalBack.style.display="flex"}
function closeModal(){modalBack.style.display="none"}function openContactModal(p){currentProductForContact=p;contactProductText.textContent=`Kontaktujete nás kvůli produktu ${p.title}.`;contactModalBack.style.display="flex"}function closeContact(){contactModalBack.style.display="none"}function openEmail(p){currentProductForEmail=p;senderMessage.value=`Dobrý den, mám zájem o ${p.title}.\n\nProsím o informaci, zda je produkt stále k dispozici.`;emailModalBack.style.display="flex"}
closeModal.onclick=closeModal;document.getElementById("closeModal").onclick=closeModal;closeContactModal.onclick=closeContact;contactMessengerBtn.onclick=()=>{closeContact();window.open(sellerMessenger,"_blank")};contactEmailBtn.onclick=()=>{const p=currentProductForContact;closeContact();if(p)openEmail(p)};cancelEmail.onclick=()=>emailModalBack.style.display="none";emailForm.onsubmit=e=>{e.preventDefault();const subject=encodeURIComponent(`Zájem o ${currentProductForEmail?.title||"produkt"}`),body=encodeURIComponent(`Od: ${senderName.value}\nE-mail: ${senderEmail.value}\n\n${senderMessage.value}`);window.open(`mailto:${sellerEmail}?subject=${subject}&body=${body}`,"_blank");emailModalBack.style.display="none"};openAdminBtn.onclick=()=>location.href="./login.html";applyFilter.onclick=applyFilter;document.getElementById("applyFilter").onclick=applyFilter;clearFilter.onclick=()=>{makerList.querySelectorAll("input").forEach(i=>i.checked=false);minPrice.value=maxPrice.value="";applyFilter()};
loadData().then(d=>{categories=d.categories;products=d.products.filter(p=>!p.sold);renderMakers();renderGrid(products)}).catch(()=>resultCount.textContent="Nabídku se nepodařilo načíst.");
</script></body></html>
