/* Load products: pokud uložené pole neexistuje seedni defaulty; jinak nech uložená data */
function loadProducts(){
  let raw = null;
  try{
    raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length >= defaultProducts.length){
        return parsed;
      }
      // pokud má uložené méně položek než default, necháme to jako uživatelské rozhodnutí (nepřepíšeme automaticky)
    }
  }catch(e){
    console.warn('loadProducts: parse error or localStorage access issue', e);
  }

  // pokud vůbec nic není v localStorage, seedni defaulty; jinak zkus vrátit parsed nebo default jako fallback
  if(!raw){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultProducts));
    return defaultProducts.slice();
  }

  try{
    const parsed = JSON.parse(raw || '[]');
    if(Array.isArray(parsed) && parsed.length) return parsed;
  }catch(e){
    console.warn('loadProducts: fallback to defaults due to invalid stored data', e);
  }

  localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultProducts));
  return defaultProducts.slice();
}

/* Helpers */
function saveProducts(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  updatePricePlaceholders();
}
function formatPrice(n){ return n ? n.toLocaleString('cs-CZ') + " Kč" : "Na dotaz"; }

/* Update min/max price placeholders */
function updatePricePlaceholders(){
  const prices = products.map(p=>p.price).filter(Boolean);
  if(prices.length){
    const minAll = Math.min(...prices);
    const maxAll = Math.max(...prices);
    document.getElementById('minPrice').placeholder = minAll;
    document.getElementById('maxPrice').placeholder = maxAll;
  } else {
    document.getElementById('minPrice').placeholder = '';
    document.getElementById('maxPrice').placeholder = '';
  }
}

  /* Renderers */
function renderMakers(){
  const makers = Array.from(new Set(products.map(p=>p.brand))).sort();
  const container = document.getElementById('makerList');
  container.innerHTML = '';
  makers.forEach(m=>{
    const row = document.createElement('label');
    row.className = 'checkboxRow';
    row.innerHTML = `<input type="checkbox" value="${m}"> <span style="font-size:13px;color:var(--muted)">${m}</span>`;
    row.querySelector('input').addEventListener('change', applyFilter);
    container.appendChild(row);
  });
}
function renderGrid(list){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  list.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';
    const imgTag = p.img ? `<img src="${p.img}" alt="${escapeHtml(p.title)}" onerror="this.style.display='none'">` : '';
    card.innerHTML = `
      <div class="thumb" role="img">${imgTag}</div>
      <div class="cardBody">
        <div class="title">${escapeHtml(p.title)}</div>
        <div class="meta">${escapeHtml(p.brand)} · ${escapeHtml(p.color)} · ${escapeHtml(p.memory)}</div>
        <div class="price">${formatPrice(p.price)}</div>
      </div>
      <div class="cardFooter">
        <button class="cta" data-id="${p.id}">Zobrazit detail</button>
      </div>
    `;
    grid.appendChild(card);
  });

  // Přidej posluchače po vytvoření všech karet
  grid.querySelectorAll('.cta').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = Number(e.currentTarget.getAttribute('data-id'));
      openModal(id);
    });
  });

  document.getElementById('resultCount').textContent = `Zobrazeno ${list.length} položek`;
}

/* Filters */
function applyFilter(){
  const checked = Array.from(document.querySelectorAll('#makerList input[type=checkbox]:checked')).map(i=>i.value);
  const minVal = document.getElementById('minPrice').value;
  const maxVal = document.getElementById('maxPrice').value;
  const min = minVal !== "" ? Number(minVal) : null;
  const max = maxVal !== "" ? Number(maxVal) : null;
  let list = products.filter(p=>{
    if(checked.length && !checked.includes(p.brand)) return false;
    if(min !== null && p.price < min) return false;
    if(max !== null && p.price > max) return false;
    return true;
  });
  renderGrid(list);
}

/* Modal detail */
const modalBackEl = document.getElementById('modalBack');
function openModal(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const main = document.getElementById('modalMain');
  main.innerHTML = p.img ? `<img src="${p.img}" alt="${escapeHtml(p.title)}" onerror="this.style.display='none'">` : '';
  const thumbs = document.getElementById('modalThumbs'); thumbs.innerHTML = '';
  for(let i=0;i<4;i++){
    const t = document.createElement('div'); t.className='thumbSmall';
    t.innerHTML = p.img ? `<img src="${p.img}" alt="" onerror="this.style.display='none'">` : '';
    t.addEventListener('click', ()=>{ main.querySelector('img') && (main.querySelector('img').src = p.img); });
    thumbs.appendChild(t);
  }
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalMeta').textContent = `${p.color} · ${p.memory}`;
  document.getElementById('modalPrice').textContent = formatPrice(p.price);
  const badge = document.getElementById('modalBadge');
  if(p.demo){ badge.style.display='inline-block'; badge.textContent='Předváděcí'; } else { badge.style.display='none'; }
  document.getElementById('modalDesc').textContent = p.note || "Bez doplňujících informací.";
  const acc = document.getElementById('modalAcc'); acc.innerHTML='';
  const items = [
    {k:'charger', label:'Nabíječka', v:p.charger},
    {k:'cable', label:'Datový kabel', v:p.cable},
    {k:'earphones', label:'Sluchátka', v:p.earphones},
    {k:'case', label:'Pouzdro', v:p.case},
    {k:'box', label:'Krabička', v:p.box}
  ];
  items.forEach(it=>{
    const node = document.createElement('label'); node.className='accItem';
    node.innerHTML = `<input type="checkbox" ${it.v ? 'checked' : ''} disabled> <span style="color:var(--muted)">${it.label}</span>`;
    acc.appendChild(node);
  });
  const descContainer = document.getElementById('modalDescription'); descContainer.innerHTML = '';
  if(p.description){
    const paragraphs = p.description.split(/\n\s*\n/);
    paragraphs.forEach(par=>{
      const pEl = document.createElement('p'); pEl.textContent = par.trim(); descContainer.appendChild(pEl);
    });
  } else descContainer.textContent = 'Bez hlavního popisu.';
  document.getElementById('msButton').onclick = ()=> window.open(`https://m.me/${sellerMessenger}`, '_blank');
  document.getElementById('emailButton').onclick = ()=> openEmailModal(p);
  modalBackEl.style.display = 'flex';
  modalBackEl.setAttribute('aria-hidden','false');
}
document.getElementById('closeModal').addEventListener('click', ()=>{ modalBackEl.style.display='none'; modalBackEl.setAttribute('aria-hidden','true'); });
modalBackEl.addEventListener('click', (e)=>{ if(e.target === modalBackEl){ modalBackEl.style.display='none'; modalBackEl.setAttribute('aria-hidden','true'); } });

/* Admin - přechod na samostatnou přihlašovací stránku */
document.getElementById('openAdminBtn').addEventListener('click', () => {
  window.location.href = './login.html';
});

/* Email modal */
function openEmailModal(product){
  currentProductForEmail = product; document.getElementById('senderName').value = ''; document.getElementById('senderEmail').value = '';
  document.getElementById('senderMessage').value = `Dobrý den, mám zájem o ${product.title} (${product.color}, ${product.memory}).\n\nProsím o info, zda je k dispozici.`;
  document.getElementById('emailModalBack').style.display='flex';
}
document.getElementById('closeEmailModal').addEventListener('click', ()=>{ document.getElementById('emailModalBack').style.display='none'; });
document.getElementById('cancelEmail').addEventListener('click', ()=>{ document.getElementById('emailModalBack').style.display='none'; });
let currentProductForEmail = null;
document.getElementById('emailForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const name = document.getElementById('senderName').value || ''; const mail = document.getElementById('senderEmail').value || ''; const msg = document.getElementById('senderMessage').value || '';
  const subject = encodeURIComponent(`Zájem o ${currentProductForEmail ? currentProductForEmail.title : 'produkt'}`);
  const body = encodeURIComponent(`Od: ${name}\nE-mail: ${mail}\n\n${msg}`);
  const mailto = `mailto:${sellerEmail}?subject=${subject}&body=${body}`; window.open(mailto, '_blank');
  document.getElementById('emailModalBack').style.display='none';
});

/* Utilities */
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* Init */
renderMakers(); renderGrid(products); updatePricePlaceholders();

/* Filters buttons */
document.getElementById('applyFilter').addEventListener('click', applyFilter);
document.getElementById('clearFilter').addEventListener('click', ()=>{
  document.querySelectorAll('#makerList input[type=checkbox]').forEach(cb=>cb.checked=false);
  document.getElementById('minPrice').value=''; document.getElementById('maxPrice').value='';
  applyFilter();
});
/* Esc closes modals */
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ document.getElementById('modalBack').style.display='none'; document.getElementById('emailModalBack').style.display='none'; } });

/* Sticky messenger on mobile */
function checkSticky(){ if(window.innerWidth <= 480){ const el=document.getElementById('contactSticky'); if(el) el.style.display='flex'; } else { const el=document.getElementById('contactSticky'); if(el) el.style.display='none'; } }
window.addEventListener('resize', checkSticky); checkSticky();
</script>
