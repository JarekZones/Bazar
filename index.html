<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soukromý bazárek</title><style>
:root{--bg:#f5f6f8;--card:#fff;--muted:#6b7280;--accent:#0b57a4;--accent-dark:#084a86;--badge:#6d28d9}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#111}.container{max-width:1200px;margin:18px auto;padding:16px}.hero{position:relative;margin-bottom:22px;border-radius:18px;overflow:hidden;background:#eadfce;box-shadow:0 5px 20px rgba(0,0,0,.09)}.hero img{width:100%;height:auto;display:block}.categoryHero{margin:0 0 18px;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}.categoryHero img{width:100%;height:auto;display:block}.adminBtn{position:absolute;right:14px;top:14px;background:rgba(17,17,17,.88);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer;z-index:2}.small,.mutedSmall{font-size:13px;color:var(--muted)}.categoryIntro{margin:8px 0 16px}.categoryIntro h2{margin:0 0 5px;font-size:24px}.categoryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.categoryTile{position:relative;height:240px;border:0;border-radius:16px;overflow:hidden;cursor:pointer;background:#dfe5ec;text-align:left;padding:0;box-shadow:0 4px 16px rgba(0,0,0,.08)}.categoryTile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.categoryTile:hover img{transform:scale(1.025)}.categoryFallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:15px}.categoryOverlay{position:absolute;inset:auto 0 0;padding:45px 18px 17px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}.categoryName{font-size:22px;font-weight:800}.categoryCount{font-size:13px;margin-top:4px;opacity:.9}.emptyCategories{grid-column:1/-1;background:#fff;border-radius:12px;padding:35px;text-align:center;color:var(--muted)}.productsView{display:none}.productsTop{display:flex;align-items:center;gap:12px;margin-bottom:14px}.backBtn{background:#fff;border:1px solid #d9dee7;border-radius:8px;padding:9px 12px;cursor:pointer}.productsTitle{font-size:22px;font-weight:800}.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.filters{background:#fff;padding:16px;border-radius:10px}.filterTitle{font-weight:700;margin-bottom:8px}.checkboxRow{display:flex;gap:8px;margin:8px 0}.rangeRow input{width:48%;padding:6px;border:1px solid #ddd;border-radius:6px}.applyBtn,.cta{background:var(--accent);color:#fff;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}.clearBtn{background:#fff;border:1px solid #dfe5ec;padding:8px 12px;border-radius:8px;cursor:pointer;margin-left:6px}.infoBar{display:flex;justify-content:space-between;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:320px}.thumb{height:140px;background:#e9eef3;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.cardBody{flex:1}.title{font-weight:700}.meta{font-size:13px;color:var(--muted)}.price{font-size:20px;font-weight:800;margin:10px 0}.cta{width:100%}.modalBack,.emailModalBack,.contactModalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}.modal{width:100%;max-width:1040px;background:#fff;border-radius:14px;padding:20px;max-height:92vh;overflow:auto}.modalTop{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.9fr);gap:24px}.galleryWrap{position:relative}.galleryMain{height:430px;background:#f0f3f6;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.galleryMain img{width:100%;height:100%;object-fit:contain}.thumbRow{display:flex;gap:10px;margin-top:10px;overflow-x:auto}.thumbSmall{width:68px;height:56px;flex:0 0 68px;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer}.thumbSmall.active{border-color:var(--accent)}.thumbSmall img{width:100%;height:100%;object-fit:contain}.galleryCount{font-size:13px;color:var(--muted);margin-top:7px}.infoBox{display:flex;flex-direction:column;min-height:430px}.infoTop{display:flex;justify-content:space-between;gap:10px}.modalTitle{font-size:28px;font-weight:800}.modalMeta{font-size:18px;color:var(--muted);margin-top:6px}.badge{display:inline-block;background:var(--badge);color:#fff;padding:6px 10px;border-radius:999px;font-weight:700}.newBadge{background:#15803d}.modalPrice{font-size:32px;font-weight:800;margin-top:20px}.sectionTitle{font-size:20px;font-weight:700}.modalNoteBox,.featureBox{margin-top:20px;padding-top:16px;border-top:1px solid #edf0f3}.modalNote{font-size:18px;color:var(--muted);margin-top:8px}.featureList{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.featureItem{font-size:18px}.buyArea{margin-top:auto;padding-top:22px}.buyButton{width:100%;background:#1769d2;color:#fff;border:0;padding:15px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer}.descriptionBox{margin-top:20px;padding-top:20px;border-top:1px solid #e5e7eb}.descriptionText{font-size:18px;color:#4b5563;line-height:1.65}.modalClose{position:absolute;right:12px;top:12px;width:36px;height:36px;background:var(--accent-dark);color:#fff;border:0;border-radius:8px;cursor:pointer;z-index:2}.contactModal,.emailPanel{width:100%;max-width:430px;background:#fff;border-radius:14px;padding:22px;position:relative}.contactButtons{display:grid;gap:10px}.contactBtn{padding:12px;border:0;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}.contactMessenger{background:#0084ff}.contactEmail{background:var(--accent)}.formRow{margin-top:10px}.formRow input,.formRow textarea{width:100%;padding:9px;border:1px solid #dfe5ec;border-radius:7px}@media(max-width:900px){.categoryGrid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.modalTop{grid-template-columns:1fr}.galleryMain{height:320px}.infoBox{min-height:auto}}@media(max-width:520px){.container{padding:10px;margin-top:6px}.hero,.categoryHero{border-radius:12px}.adminBtn{right:8px;top:8px;padding:6px 9px;font-size:12px}.categoryGrid,.grid{grid-template-columns:1fr}.categoryTile{height:210px}.featureList{grid-template-columns:1fr}.productsTop{align-items:flex-start}.categoryIntro h2,.productsTitle{font-size:20px}}
</style></head><body><div class="container"><div class="hero" id="homeHero"><img src="images/bazarek-hero.png" alt="Soukromý bazárek – Dejte věcem druhou šanci"><button class="adminBtn" id="openAdminBtn">Admin</button></div>
<section id="categoriesView"><div class="categoryIntro"><h2>Kategorie</h2><div class="small">Co právě hledáte?</div></div><div id="categoryGrid" class="categoryGrid"></div></section>
<section id="productsView" class="productsView"><div class="categoryHero"><img src="images/bazarek2-hero.jpg" alt="Dejte věcem druhou šanci"></div><div class="productsTop"><button id="backToCategories" class="backBtn">← Všechny kategorie</button><div><div id="productsTitle" class="productsTitle">Produkty</div><div id="productsSubtitle" class="small"></div></div></div><div class="layout"><aside class="filters"><div class="filterTitle">Filtr</div><div id="brandFilterWrap"><div class="small">Výrobce / značka</div><div id="makerList"></div></div><div class="rangeRow"><div class="small" style="margin-top:12px">Cena (Kč)</div><div style="display:flex;gap:6px;margin-top:7px"><input id="minPrice" type="number" placeholder="min"><input id="maxPrice" type="number" placeholder="max"></div></div><div style="margin-top:10px"><button class="applyBtn" id="applyFilter">Použít</button><button class="clearBtn" id="clearFilter">Vymazat</button></div></aside><main><div class="infoBar"><div id="resultCount"></div><div class="mutedSmall">Aktuální nabídka</div></div><div class="grid" id="grid"></div></main></div></section></div>
<div class="modalBack" id="modalBack"><div class="modal"><div class="modalTop"><div class="galleryWrap" id="modalGalleryWrapper"><button class="modalClose" id="closeModal">✕</button><div class="galleryMain" id="modalMain"></div><div class="thumbRow" id="modalThumbs"></div></div><aside class="infoBox"><div class="infoTop"><div><div id="modalTitle" class="modalTitle"></div><div id="modalMeta" class="modalMeta"></div></div><div id="modalBadge" class="badge" style="display:none"></div></div><div id="modalPrice" class="modalPrice"></div><div class="modalNoteBox" id="modalNoteBox"><div class="sectionTitle">Doplňující informace</div><div id="modalDesc" class="modalNote"></div></div><div class="featureBox" id="featureBox"><div class="sectionTitle">Vlastnosti</div><div class="featureList" id="modalFeatures"></div></div><div class="buyArea"><button class="buyButton" id="buyButton">Koupit</button></div></aside></div><div class="descriptionBox"><div class="sectionTitle">Popis produktu</div><div id="modalDescription" class="descriptionText"></div></div></div></div>
<div class="contactModalBack" id="contactModalBack"><div class="contactModal"><button class="modalClose" id="closeContactModal">✕</button><h3>Jak chcete kontaktovat prodejce?</h3><div id="contactProductText" class="small" style="margin-bottom:16px"></div><div class="contactButtons"><button class="contactBtn contactMessenger" id="contactMessengerBtn">Kontakt přes Messenger</button><button class="contactBtn contactEmail" id="contactEmailBtn">Kontakt přes e-mail</button></div></div></div>
<div class="emailModalBack" id="emailModalBack"><div class="emailPanel"><h3>Poslat e-mail</h3><form id="emailForm"><div class="formRow"><input id="senderName" placeholder="Jméno" required></div><div class="formRow"><input id="senderEmail" type="email" placeholder="E-mail" required></div><div class="formRow"><textarea id="senderMessage" rows="5" required></textarea></div><div style="margin-top:10px"><button class="applyBtn" type="submit">Odeslat e-mail</button><button class="clearBtn" type="button" id="cancelEmail">Zrušit</button></div></form></div></div>
<script>
const API_URL="https://mobilmax-bazar-api.j-preclik.workers.dev",sellerMessenger="https://m.me/jaroslav.preclik",sellerEmail="j.preclik@mobilmax.cz";let products=[],categories=[],currentCategoryId=null,currentProductForContact=null,currentProductForEmail=null;
async function loadData(){const r=await fetch(API_URL+"/api/products",{cache:"no-store"});if(!r.ok)throw new Error("Načtení se nepodařilo");const d=await r.json();return{products:Array.isArray(d.products)?d.products:[],categories:Array.isArray(d.categories)?d.categories:[]}}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function formatPrice(n){return Number(n)?Number(n).toLocaleString("cs-CZ")+" Kč":"Na dotaz"}function getProductImages(p){return Array.isArray(p?.images)&&p.images.length?p.images.filter(Boolean):(p?.img?[p.img]:[])}
function categoryFor(p){return categories.find(c=>c.id===p.category)}function categoryFields(cat){return cat?.fields||{brand:true,color:true,memory:true,note:true}}function publicMeta(p,cat){const f=categoryFields(cat),vals=[];if(f.brand&&p.brand)vals.push(p.brand);if(f.color&&p.color)vals.push(p.color);if(f.memory&&p.memory)vals.push(p.memory);return vals}
function renderCategories(){categoryGrid.innerHTML="";const visible=categories.filter(c=>c.visible!==false&&products.some(p=>p.category===c.id));if(!visible.length){categoryGrid.innerHTML='<div class="emptyCategories">Momentálně nejsou k dispozici žádné kategorie s aktivními produkty.</div>';return}visible.forEach(c=>{const count=products.filter(p=>p.category===c.id).length,t=document.createElement("button");t.className="categoryTile";t.dataset.id=c.id;t.innerHTML=`${c.image?`<img src="${escapeHtml(c.image)}" alt="${escapeHtml(c.name)}">`:'<div class="categoryFallback">Bez obrázku kategorie</div>'}<div class="categoryOverlay"><div class="categoryName">${escapeHtml(c.name)}</div><div class="categoryCount">${count} ${count===1?'položka':'položek'}</div></div>`;t.onclick=()=>openCategory(c.id);categoryGrid.appendChild(t)})}
function openCategory(id){currentCategoryId=id;const c=categories.find(x=>x.id===id);homeHero.style.display="none";categoriesView.style.display="none";productsView.style.display="block";productsTitle.textContent=c?.name||"Produkty";productsSubtitle.textContent="Nabídka v této kategorii";renderMakers();clearProductFilters();window.scrollTo({top:0,behavior:"smooth"})}
function showCategories(){currentCategoryId=null;productsView.style.display="none";categoriesView.style.display="block";homeHero.style.display="block";window.scrollTo({top:0,behavior:"smooth"})}
function categoryProducts(){return products.filter(p=>p.category===currentCategoryId)}
function renderMakers(){const cat=categories.find(c=>c.id===currentCategoryId),showBrand=categoryFields(cat).brand!==false;brandFilterWrap.style.display=showBrand?"block":"none";makerList.innerHTML="";if(!showBrand)return;const makers=[...new Set(categoryProducts().map(p=>p.brand).filter(Boolean))].sort();makers.forEach(m=>{const l=document.createElement("label");l.className="checkboxRow";l.innerHTML=`<input type="checkbox" value="${escapeHtml(m)}"> ${escapeHtml(m)}`;l.querySelector("input").onchange=applyProductFilter;makerList.appendChild(l)})}
function renderGrid(list){grid.innerHTML="";if(!list.length)grid.innerHTML='<div class="small" style="grid-column:1/-1;padding:30px">Momentálně nejsou k dispozici žádné odpovídající produkty.</div>';list.forEach(p=>{const card=document.createElement("div");card.className="card";const cover=getProductImages(p)[0]||"",meta=publicMeta(p,categoryFor(p));card.innerHTML=`<div class="thumb">${cover?`<img src="${escapeHtml(cover)}">`:"Bez fotografie"}</div><div class="cardBody"><div class="title">${escapeHtml(p.title)}</div><div class="meta">${meta.map(escapeHtml).join(" · ")}</div><div class="price">${formatPrice(p.price)}</div></div><button class="cta" data-id="${p.id}">Zobrazit detail</button>`;grid.appendChild(card)});grid.querySelectorAll(".cta").forEach(b=>b.onclick=()=>openModal(Number(b.dataset.id)));resultCount.textContent=`Zobrazeno ${list.length} položek`}
function applyProductFilter(){const checked=[...makerList.querySelectorAll("input:checked")].map(i=>i.value),min=minPrice.value===""?null:Number(minPrice.value),max=maxPrice.value===""?null:Number(maxPrice.value);renderGrid(categoryProducts().filter(p=>(!checked.length||checked.includes(p.brand))&&(min===null||Number(p.price)>=min)&&(max===null||Number(p.price)<=max)))}
function clearProductFilters(){makerList.querySelectorAll("input").forEach(i=>i.checked=false);minPrice.value="";maxPrice.value="";applyProductFilter()}
function openModal(id){const p=products.find(x=>Number(x.id)===id);if(!p)return;const images=getProductImages(p),cat=categoryFor(p),fields=categoryFields(cat);modalMain.innerHTML="";modalThumbs.innerHTML="";document.querySelectorAll("#modalGalleryWrapper .galleryCount").forEach(x=>x.remove());if(images.length){const im=document.createElement("img");im.src=images[0];modalMain.appendChild(im);images.forEach((src,i)=>{const t=document.createElement("div");t.className="thumbSmall"+(i===0?" active":"");t.innerHTML=`<img src="${escapeHtml(src)}">`;t.onclick=()=>{im.src=src;modalThumbs.querySelectorAll(".thumbSmall").forEach(x=>x.classList.remove("active"));t.classList.add("active")};modalThumbs.appendChild(t)});const cnt=document.createElement("div");cnt.className="galleryCount";cnt.textContent=`${images.length} obrázků`;modalGalleryWrapper.appendChild(cnt)}else modalMain.textContent="Bez fotografie";modalTitle.textContent=p.title||"";modalMeta.textContent=publicMeta(p,cat).join(" · ");modalMeta.style.display=modalMeta.textContent?"block":"none";modalPrice.textContent=formatPrice(p.price);if(p.condition==="new"){modalBadge.style.display="inline-block";modalBadge.className="badge newBadge";modalBadge.textContent="Nové"}else if(p.condition==="demo"||p.demo){modalBadge.style.display="inline-block";modalBadge.className="badge";modalBadge.textContent="Předváděcí"}else modalBadge.style.display="none";const showNote=fields.note!==false&&String(p.note||"").trim();modalNoteBox.style.display=showNote?"block":"none";modalDesc.textContent=showNote?p.note:"";modalDescription.innerHTML="";(p.description||"").split(/\n\s*\n/).filter(Boolean).forEach(txt=>{const par=document.createElement("p");par.textContent=txt;modalDescription.appendChild(par)});modalFeatures.innerHTML="";const selected=new Set(Array.isArray(p.features)?p.features:[]),defs=Array.isArray(cat?.features)?cat.features:[];defs.filter(f=>selected.has(f.id)).forEach(f=>{const n=document.createElement("div");n.className="featureItem";n.innerHTML=`<span style="color:var(--accent)">✓</span> ${escapeHtml(f.name)}`;modalFeatures.appendChild(n)});featureBox.style.display=modalFeatures.children.length?"block":"none";buyButton.onclick=()=>openContactModal(p);modalBack.style.display="flex"}
function closeProductModal(){modalBack.style.display="none"}function openContactModal(p){currentProductForContact=p;contactProductText.textContent=`Kontaktujete nás kvůli produktu ${p.title}.`;contactModalBack.style.display="flex"}function closeContact(){contactModalBack.style.display="none"}function openEmail(p){currentProductForEmail=p;senderMessage.value=`Dobrý den, mám zájem o ${p.title}.\n\nProsím o informaci, zda je produkt stále k dispozici.`;emailModalBack.style.display="flex"}
document.getElementById("closeModal").onclick=closeProductModal;modalBack.onclick=e=>{if(e.target===modalBack)closeProductModal()};closeContactModal.onclick=closeContact;contactModalBack.onclick=e=>{if(e.target===contactModalBack)closeContact()};contactMessengerBtn.onclick=()=>{closeContact();window.open(sellerMessenger,"_blank")};contactEmailBtn.onclick=()=>{const p=currentProductForContact;closeContact();if(p)openEmail(p)};cancelEmail.onclick=()=>emailModalBack.style.display="none";emailForm.onsubmit=e=>{e.preventDefault();const subject=encodeURIComponent(`Zájem o ${currentProductForEmail?.title||"produkt"}`),body=encodeURIComponent(`Od: ${senderName.value}\nE-mail: ${senderEmail.value}\n\n${senderMessage.value}`);window.open(`mailto:${sellerEmail}?subject=${subject}&body=${body}`,"_blank");emailModalBack.style.display="none"};openAdminBtn.onclick=()=>location.href="./login.html";backToCategories.onclick=showCategories;document.getElementById("applyFilter").onclick=applyProductFilter;clearFilter.onclick=clearProductFilters;document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeProductModal();closeContact();emailModalBack.style.display="none"}});
loadData().then(d=>{categories=d.categories;products=d.products.filter(p=>!p.sold);renderCategories()}).catch(()=>{categoryGrid.innerHTML='<div class="emptyCategories">Nabídku se nepodařilo načíst.</div>'});
</script></body></html>
