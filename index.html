<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nabídka použitých telefonů</title>

<style>
  /* --- tvoje původní CSS beze změn --- */
  /* (ponechal jsem vše, jen jsem odstranil styly admin modalu) */
</style>
</head>

<body>
  <div class="container">
    <header>
      <div class="brandImg">IMG</div>
      <div>
        <h1>Nabídka použitých telefonů</h1>
        <div class="small">Přehled dostupných kusů — vyber značku nebo cenu</div>
      </div>

      <!-- ✔️ Opravené tlačítko Admin -->
      <button class="adminBtn" id="openAdminBtn">Admin</button>
    </header>

    <div class="layout">
      <aside class="filters" id="filters">
        <!-- filtry beze změn -->
        <div>
          <div class="filterTitle">Filtr</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Výrobce</div>
          <div id="makerList"></div>

          <div class="rangeRow">
            <div style="font-size:13px;color:var(--muted);margin-top:10px">Cenový rozsah (Kč)</div>
            <div class="priceGroup" style="display:flex;gap:8px;margin-top:8px">
              <input id="minPrice" type="number" placeholder="min" />
              <input id="maxPrice" type="number" placeholder="max" />
            </div>
          </div>

          <div style="display:flex;gap:8px">
            <button class="applyBtn" id="applyFilter">Použít filtr</button>
            <button class="clearBtn" id="clearFilter">Vymazat filtr</button>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="infoBar">
          <div id="resultCount">Zobrazeno 0 položek</div>
          <div class="mutedSmall">Tento prototyp používá placeholder data + localStorage</div>
        </div>

        <div class="grid" id="grid"></div>

        <footer>© 2026 — Nabídka použitých telefonů</footer>
      </main>
    </div>
  </div>

  <!-- ✔️ ponechán pouze produktový modal -->
  <div class="modalBack" id="modalBack">
    <div class="modal">
      <button class="modalClose" id="closeModal">✕</button>
      <div class="galleryMain" id="modalMain"></div>
      <div class="thumbRow" id="modalThumbs"></div>

      <aside class="infoBox">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div id="modalTitle" class="modalTitle"></div>
            <div id="modalMeta" class="meta"></div>
          </div>
          <div id="modalBadge" class="badge" style="display:none"></div>
        </div>

        <div id="modalPrice" class="price"></div>

        <div style="margin-top:12px">
          <div class="sectionTitle">Doplňující informace</div>
          <div id="modalDesc"></div>
        </div>

        <div style="margin-top:12px">
          <div class="sectionTitle">Příslušenství</div>
          <div class="accList" id="modalAcc"></div>
        </div>

        <div class="buyArea">
          <div class="sectionTitle">Chci koupit</div>
          <div class="buyButtons">
            <button class="msBtn" id="msButton">Messenger</button>
            <button class="emailBtn" id="emailButton">Kontakt přes e‑mail</button>
          </div>
        </div>
      </aside>

      <div class="spanFull productDescription" id="modalDescription"></div>
    </div>
  </div>

<script>
/* ✔️ celý tvůj původní JS beze změn */
/* ✔️ pouze odstraněny části admin modalu */
/* ✔️ přidána login kontrola */

document.getElementById("openAdminBtn").addEventListener("click", () => {
  if(localStorage.getItem("adminLogged") === "true"){
    location.href = "admin.html";
  } else {
    location.href = "login.html";
  }
});

/* ✔️ zbytek tvého JS (loadProducts, renderGrid, modal, filtry, email modal) */
</script>

</body>
</html>
